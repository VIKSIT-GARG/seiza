# ────────────── seiza. // A system of my own. — Starship Prompt ──────────────
add_newline = false
command_timeout = 250

format = """$directory$git_branch$git_status$python$nodejs$rust$character"""
right_format = """$status$cmd_duration$battery"""

[character]
success_symbol = "[✦](bold #C4B5FD) "
error_symbol = "[✦](bold #F28FAD) "

[status]
disabled = false
symbol = "✘ "
style = "bold #F28FAD"
format = "[$symbol$status]($style) "

[directory]
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"
style = "bold #C4B5FD"
read_only = " 󰌾"
read_only_style = "bold #F28FAD"

[git_branch]
symbol = " "
style = "bold #9CC9FF"
format = "[$symbol$branch]($style) "

[git_status]
style = "#9CE0C2"
format = "([$all_status$ahead_behind]($style) )"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = "[󰞇 ](bold #F28FAD)"
up_to_date = ""
untracked = "[? ](#F2B8D4)"
modified = "[󱗜 ](#F5D6A8)"
staged = "[+ ](#9CE0C2)"
renamed = "» "
deleted = "[✘ ](#F28FAD)"

# Shown only inside explicit Python projects (pyproject.toml/requirements/etc.) or active virtualenv, NOT in $HOME
[python]
symbol = " "
style = "#F5D6A8"
detect_extensions = []
detect_folders = []
detect_files = ["pyproject.toml", "setup.py", "setup.cfg", "requirements.txt", "Pipfile", "uv.lock", ".python-version"]
format = "[${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\))]($style) "

[nodejs]
symbol = " "
style = "#9CE0C2"
format = "[${symbol}(${version})]($style) "

[rust]
symbol = " "
style = "#F2B8D4"
format = "[${symbol}(${version})]($style) "

[cmd_duration]
min_time = 1500
style = "#F2B8D4"
format = "[⏱ $duration]($style) "

[battery]
full_symbol = "󰂅 "
charging_symbol = "󰂄 "
discharging_symbol = "󰁹 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "
format = "[$symbol$percentage]($style)"

[[battery.display]]
threshold = 25
style = "bold #F28FAD"

[[battery.display]]
threshold = 60
style = "#A6B0D0"
